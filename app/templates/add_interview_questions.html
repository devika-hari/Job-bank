{% extends "base.html" %}
{% block title %}Add Questions — {{ app_title }}{% endblock %}
{% block content %}
<a href="/jobs/{{ job.id }}" class="text-decoration-none">&larr; Back to job</a>
<h1 class="mt-2">Add questions</h1>
<p class="text-muted">
  Round {{ interview.round_number }} · {{ job.role }} @ {{ job.company_name }}
</p>

<form method="post" action="/jobs/{{ job.id }}/interviews/{{ interview.id }}/questions/add" class="col-lg-10">
  <div class="card card-body shadow-sm mb-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="h5 mb-0">Questions</h2>
      <button type="button" class="btn btn-sm btn-outline-primary" id="add-question-btn">+ Add question</button>
    </div>
    <div id="questions-container">
      <div class="question-row border rounded p-3 mb-3 bg-white">
        <div class="mb-2">
          <label class="form-label">Question *</label>
          <textarea name="question_text" class="form-control" rows="2" required></textarea>
        </div>
        <div class="mb-2">
          <label class="form-label">Notes</label>
          <textarea name="question_notes" class="form-control" rows="1"></textarea>
        </div>
        <div class="mb-0">
          <label class="form-label">Tags</label>
          <input name="question_tags" class="form-control" placeholder="dbt, Airflow">
        </div>
      </div>
    </div>
  </div>
  <button type="submit" class="btn btn-primary">Save questions</button>
</form>

<template id="question-row-template">
  <div class="question-row border rounded p-3 mb-3 bg-white">
    <div class="d-flex justify-content-end mb-2">
      <button type="button" class="btn btn-sm btn-outline-danger remove-question-btn">Remove</button>
    </div>
    <div class="mb-2">
      <label class="form-label">Question *</label>
      <textarea name="question_text" class="form-control" rows="2"></textarea>
    </div>
    <div class="mb-2">
      <label class="form-label">Notes</label>
      <textarea name="question_notes" class="form-control" rows="1"></textarea>
    </div>
    <div class="mb-0">
      <label class="form-label">Tags</label>
      <input name="question_tags" class="form-control" placeholder="Python, SQL">
    </div>
  </div>
</template>

<script>
  (function () {
    const container = document.getElementById("questions-container");
    const template = document.getElementById("question-row-template");
    document.getElementById("add-question-btn").addEventListener("click", function () {
      container.appendChild(template.content.cloneNode(true));
    });
    container.addEventListener("click", function (e) {
      if (e.target.classList.contains("remove-question-btn")) {
        if (container.querySelectorAll(".question-row").length > 1) {
          e.target.closest(".question-row").remove();
        }
      }
    });
  })();
</script>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_title }}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand" href="/jobs">{{ app_title }}</a>
      <div class="navbar-nav">
        <a class="nav-link text-white" href="/jobs">List Jobs</a>
        <a class="nav-link text-white" href="/jobs/add">Add Job</a>
        <a class="nav-link text-white" href="/questions/search">Search Questions</a>
        <a class="nav-link text-white" href="/docs" target="_blank">API Docs</a>
      </div>
    </div>
  </nav>

  <main class="container pb-5">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
